[project]
name = "broza-app"
version = "0.1.0"
description = "Newsletter application: Gold curation, templates, config UI and scheduling on top of broza-core."
requires-python = ">=3.12"
dependencies = [
    "broza-core",
    "streamlit>=1.38",
    "apscheduler>=3.10",
]

[tool.uv.sources]
broza-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
