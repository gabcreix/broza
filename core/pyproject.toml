[project]
name = "broza-core"
version = "0.1.0"
description = "Reusable, source-agnostic content acquisition, normalization, enrichment and query engine."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "feedparser>=6.0",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "supabase>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "anthropic>=0.34",
    "asyncpraw>=7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
